<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- policy -->
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Moondog in a terminal</title>
  <link rel="stylesheet" href="terminal.css">
  <script type="module" src="terminal.js"></script>
</head>
<body>
  <div class="screen" data-screen role="application" aria-label="Moondog's room in a terminal. Type here."></div>
  <div class="check" data-check hidden></div>
  <div class="player" data-player hidden aria-label="Preview player">
    <img class="player-art" data-player-art alt="" width="56" height="56" hidden>
    <div class="player-body">
      <div class="player-head">
        <p class="player-now" aria-live="polite"><strong data-player-title></strong><span data-player-artist></span></p>
        <a data-player-link href="https://music.apple.com/" target="_blank" rel="noopener">Listen on Apple Music</a>
      </div>
      <div class="player-seek" data-player-seek role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0"><span data-player-bar></span></div>
      <div class="player-foot">
        <span class="player-time" data-player-time>0:00 / 0:30</span>
        <div class="player-controls">
          <button type="button" data-player-prev aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="19 20 9 12 19 4" /><rect x="4" y="4" width="2.5" height="16" /></svg></button>
          <button type="button" class="player-toggle" data-player-toggle aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7 4 20 12 7 20" /></svg></button>
          <button type="button" data-player-next aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 4 15 12 5 20" /><rect x="17.5" y="4" width="2.5" height="16" /></svg></button>
        </div>
        <span class="player-position" data-player-position></span>
      </div>
    </div>
    <audio preload="none"></audio>
  </div>
  <div class="keys" aria-label="Keys for touch screens">
    <button type="button" data-command="/taste">/taste</button>
    <button type="button" data-command="/help">/help</button>
    <button type="button" data-key="tab">Tab</button>
    <button type="button" data-key="up" aria-label="Up">↑</button>
    <button type="button" data-key="down" aria-label="Down">↓</button>
    <button type="button" data-key="enter">Enter</button>
    <button type="button" data-key="esc">Esc</button>
  </div>
</body>
</html>
