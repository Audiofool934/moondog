name: Project page

on:
  pull_request:
    paths:
      - "site/**"
      - "src/**"
      - "app/**"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "src/**"
      - "app/**"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the page and the room
    runs-on: ubuntu-latest
    # Room to copy a release's downloads to the mirror.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install declared npm version
        run: npm install --global npm@11.16.0
      - name: Install Moondog and the page tools
        run: |
          npm ci
          npm ci --prefix site
      - name: Test the public agent with a fake model
        run: node --disable-warning=ExperimentalWarning --test site/server/agent-server.test.mjs
      - name: Build the page and its scene
        # The token reads the release list, for the newest release with a Mac download.
        # On main, the build first copies new downloads to the Cloudflare mirror (site/mirror.mjs).
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node site/build.mjs ${{ github.event_name != 'pull_request' && '--mirror' || '' }}
      - name: Upload the page
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # After the new page is live, the mirror keeps only the files it links (site/mirror.mjs).
  prune-mirror:
    name: Keep only the offered downloads on the mirror
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Delete files the page no longer links
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node site/mirror.mjs --prune
