name: Desktop builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop, ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm install --global npm@11.16.0
      # The npm package lists macOS and Linux only, because its terminal launcher is a shell script.
      # The Windows desktop carries the same core, so its install skips that platform check.
      - run: npm ci --ignore-scripts --no-audit --no-fund ${{ runner.os == 'Windows' && '--force' || '' }}
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Check desktop platform boundaries
        run: node --test tests/runtime/app-packaging.test.mjs tests/runtime/app-updates.test.mjs tests/runtime/app-platform.test.mjs tests/runtime/desktop-core-platform.test.mjs
      - name: Build native desktop installer
        run: npm run pack
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The smoke check runs what a listener gets: the app the installer puts in place, and the AppImage itself.
      - name: Install and exercise the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: app
        run: |
          $installer = Get-ChildItem release -Filter 'Moondog-*-win-x64.exe' | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Moondog.exe' | Select-Object -First 1
          if (-not $installed) { throw 'The installer did not install Moondog.exe.' }
          $env:MOONDOG_SMOKE_EXECUTABLE = $installed.FullName
          npm run smoke
      - name: Exercise the Linux AppImage
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          appimage="$(ls "$PWD"/release/Moondog-*-linux-x86_64.AppImage)"
          chmod +x "$appimage"
          # Runners have no FUSE; the AppImage runtime can extract itself and run instead.
          MOONDOG_SMOKE_EXECUTABLE="$appimage" APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a npm run smoke
      - name: Save desktop smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.platform }}-x64
          path: app/release/smoke/
          if-no-files-found: ignore
      - name: Save installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: moondog-${{ matrix.platform }}-x64
          path: |
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.blockmap
            app/release/latest*.yml
          if-no-files-found: error
