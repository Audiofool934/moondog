name: Desktop builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop, ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Check desktop platform boundaries
        run: node --test tests/runtime/app-packaging.test.mjs tests/runtime/app-updates.test.mjs tests/runtime/app-platform.test.mjs tests/runtime/desktop-core-platform.test.mjs
      - name: Build native desktop installer
        run: npm run pack
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exercise packaged Windows desktop
        if: runner.os == 'Windows'
        run: npm run smoke
        working-directory: app
      - name: Exercise packaged Linux desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
        working-directory: app
      - name: Save desktop smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.platform }}-x64
          path: app/release/smoke/
          if-no-files-found: ignore
      - name: Save installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: moondog-${{ matrix.platform }}-x64
          path: |
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.blockmap
            app/release/latest*.yml
          if-no-files-found: error
