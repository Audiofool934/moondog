name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.16.0
      - name: Verify release identity and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-version.mjs "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm run verify:clean-source

  # A stable version waits for the owner's approval in the release-approval environment.
  # A prerelease (a version with a hyphen, such as 0.3.0-beta.6) skips this job and publishes on its own.
  approve-stable:
    name: Approve the stable release
    needs: verify
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-approval
    steps:
      - run: echo "Approved ${{ github.ref_name }} for publication."

  publish:
    needs: [verify, approve-stable]
    # Runs after verify passes, and after the approval for a stable version; a rejected,
    # cancelled or failed approval stops it. Only a prerelease may skip the approval.
    if: ${{ always() && needs.verify.result == 'success' && (needs.approve-stable.result == 'success' || (needs.approve-stable.result == 'skipped' && contains(github.ref_name, '-'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish or verify npm, then prepare the GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-npm.mjs "$RELEASE_TAG"
