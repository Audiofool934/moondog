<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.scdn.co https://*.mzstatic.com; media-src https://audio-ssl.itunes.apple.com; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Moondog</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-sidebar" viewBox="0 0 16 16"><rect x="1.75" y="2.5" width="12.5" height="11" rx="2.2"/><path d="M5.75 2.75v10.5"/></symbol>
    <symbol id="i-panel" viewBox="0 0 16 16"><rect x="1.75" y="2.5" width="12.5" height="11" rx="2.2"/><path d="M10.25 2.75v10.5"/></symbol>
    <symbol id="i-new" viewBox="0 0 16 16"><path d="M8 3.2v9.6M3.2 8h9.6"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 12.6V3.6M4.2 7.2 8 3.4l3.8 3.8"/></symbol>
    <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 16 16"><rect x="3" y="3.5" width="10" height="7" rx="1.2"/><path d="M1.6 12.6h12.8"/></symbol>
    <symbol id="i-record" viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="6"/><circle cx="24" cy="24" r="1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.2v13.6a.9.9 0 0 0 1.37.77l10.6-6.8a.9.9 0 0 0 0-1.54L8.87 4.43A.9.9 0 0 0 7.5 5.2z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5.5 6.2v11.6l8.6-5.8z"/><rect x="15.6" y="6" width="2.6" height="12" rx="1"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18.5 6.2v11.6L9.9 12z"/><rect x="5.8" y="6" width="2.6" height="12" rx="1"/></symbol>
    <symbol id="i-more" viewBox="0 0 16 16"><circle cx="3.6" cy="8" r="0.9" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="0.9" fill="currentColor" stroke="none"/><circle cx="12.4" cy="8" r="0.9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.6c0-.8.6-1.4 1.4-1.4h2.8l1.5 1.6h4.9c.8 0 1.4.6 1.4 1.4v5.6c0 .8-.6 1.4-1.4 1.4H3.4c-.8 0-1.4-.6-1.4-1.4z"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 16 16"><path d="M2 11.8V4.6c0-.8.6-1.4 1.4-1.4h2.8l1.5 1.6h4.1c.8 0 1.4.6 1.4 1.4v.9"/><path d="M2.3 12.4 4 7.9c.2-.5.6-.8 1.1-.8h8.6c.6 0 1 .6.8 1.1l-1.5 3.9c-.2.5-.6.8-1.1.8H2.9"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></symbol>
  </svg>
  <div class="window" data-window>
    <header class="bar">
      <div class="start"><button type="button" data-toggle-sidebar><svg class="icon"><use href="#i-sidebar"/></svg></button></div>
      <div class="title" data-title></div>
      <div class="end"><button type="button" data-toggle-inspector><svg class="icon"><use href="#i-panel"/></svg></button></div>
    </header>

    <aside class="sidebar" data-sidebar>
      <button type="button" class="new" data-new><svg class="icon"><use href="#i-new"/></svg><span data-new-label></span><kbd>⌘N</kbd></button>
      <nav class="sessions" data-sessions></nav>
      <div class="foot">
        <button type="button" class="status" data-status-button><span class="dot" data-spotify-dot></span><span data-status></span></button>
        <button type="button" class="gear" data-settings-button><svg class="icon"><use href="#i-settings"/></svg></button>
      </div>
    </aside>

    <main class="room">
      <div class="scroll" data-scroll><div class="column" data-column></div></div>
      <div class="composer">
        <form class="field" data-form>
          <textarea rows="1" data-input spellcheck="true" autofocus></textarea>
          <button type="submit" data-send disabled><svg class="icon"><use href="#i-up"/></svg></button>
        </form>
        <div class="under"><button type="button" data-device></button><button type="button" data-model></button></div>
      </div>
    </main>

    <div class="grip" data-grip="sidebar"></div>
    <div class="grip" data-grip="inspector"></div>
    <p class="notice" data-notice role="status" hidden></p>
    <div class="drop" data-drop hidden><p data-drop-hint></p></div>
    <aside class="inspector" data-inspector>
      <section class="panel now">
        <h2><span class="side" data-side aria-hidden="true">A</span><span data-now-label></span><span class="badge" data-badge hidden></span></h2>
        <div class="art" data-art>
          <img alt="" data-cover hidden>
          <div class="blank" data-blank><svg class="icon"><use href="#i-record"/></svg></div>
          <div class="controls" data-controls hidden>
            <button type="button" data-previous><svg class="icon"><use href="#i-prev"/></svg></button>
            <button type="button" class="toggle" data-toggle><svg class="icon"><use href="#i-pause"/></svg></button>
            <button type="button" data-next><svg class="icon"><use href="#i-next"/></svg></button>
          </div>
        </div>
        <div class="song"><h3 data-song></h3><p data-artist></p><p data-album></p></div>
        <div class="progress" data-progress hidden><div class="ruler" data-ruler aria-hidden="true"></div><div class="times"><span data-elapsed></span><span data-duration></span></div></div>
        <button type="button" class="device" data-device-row hidden><svg class="icon"><use href="#i-laptop"/></svg><span data-device-name></span><span class="repeat" data-repeat hidden></span></button>
      </section>
      <section class="panel next" data-next-panel hidden>
        <h2 data-next-label></h2>
        <ol data-queue></ol>
      </section>
    </aside>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
