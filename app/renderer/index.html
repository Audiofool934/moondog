  <div class="window" data-window>
    <div class="mood" aria-hidden="true" data-mood></div>
    <div class="ambient" aria-hidden="true" data-ambient></div>
    <header class="bar">
      <div class="bar-title"><button type="button" class="bar-record" data-bar-record data-tip-at="below" tabindex="-1"></button></div>
      <div class="bar-start">
        <button type="button" class="tool" data-toggle-sidebar data-tip-at="below"><svg class="icon"><use href="#i-sidebar"/></svg></button>
        <button type="button" class="tool" data-new data-tip-at="below"><svg class="icon"><use href="#i-compose"/></svg></button>
        <span class="bar-name" data-title></span>
      </div>
      <div class="bar-end">
        <div class="mini" data-mini hidden>
          <button type="button" class="mini-song" data-mini-open><img alt="" data-mini-cover><span data-mini-song></span></button>
          <button type="button" class="tool" data-mini-toggle data-tip-at="below"><svg class="icon fill"><use href="#i-pause"/></svg></button>
          <button type="button" class="tool" data-mini-next data-tip-at="below"><svg class="icon fill"><use href="#i-next"/></svg></button>
        </div>
        <button type="button" class="button small update" data-update data-tip-at="below" hidden></button>
        <button type="button" class="tool" data-settings-button data-tip-at="below"><svg class="icon"><use href="#i-settings"/></svg></button>
        <button type="button" class="tool" data-toggle-inspector data-tip-at="below"><svg class="icon"><use href="#i-panel"/></svg></button>
      </div>
    </header>

    <aside class="sidebar" data-sidebar>
      <div class="frame"><nav class="sessions" data-sessions></nav></div>
      <button type="button" class="link-button connect-line" data-connect hidden></button>
    </aside>

    <main class="room" data-room>
      <div class="stage" data-stage><div class="record-frame" data-record-frame><button type="button" class="record-button" data-record-button tabindex="-1"><canvas class="record" aria-hidden="true" data-record></canvas></button><button type="button" class="tool expand" data-expand tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg></button></div></div>
      <div class="frame"><div class="scroll" data-scroll><div class="lead" aria-hidden="true" data-lead></div><div class="column" data-column></div></div></div>
      <div class="composer" data-composer>
        <button type="button" class="jump" data-jump hidden><svg class="icon"><use href="#i-down"/></svg></button>
        <p class="notice" data-notice role="status" hidden></p>
        <form class="field" data-form>
          <textarea rows="1" data-input spellcheck="true" autofocus></textarea>
          <button type="button" class="pick" data-service><svg class="icon fill"><use href="#i-spotify"/></svg><span></span></button>
          <button type="button" class="pick" data-model><svg class="icon fill"><use href="#i-model"/></svg><span></span></button>
          <button type="submit" class="send" data-send disabled><svg class="icon"><use href="#i-up"/></svg></button>
        </form>
      </div>
    </main>

    <aside class="inspector" data-inspector>
      <div class="frame"><div class="inspector-scroll" data-inspector-scroll>
        <section class="now" data-now>
          <div class="art" data-art>
            <img alt="" data-cover hidden>
            <div class="blank" data-blank><svg class="icon"><use href="#i-record"/></svg></div>
          </div>
          <div class="song">
            <h2 data-song></h2>
            <p class="artist" data-artist></p>
            <p class="album" data-album></p>
          </div>
          <div class="progress" data-progress hidden>
            <div class="track" data-track role="slider" tabindex="0" aria-valuemin="0"><div class="fill" data-fill></div><div class="knob" data-knob></div></div>
            <div class="times"><span data-elapsed></span><span class="badge" data-badge hidden></span><span data-duration></span></div>
          </div>
          <div class="transport" data-transport hidden>
            <button type="button" class="tool" data-previous><svg class="icon fill"><use href="#i-prev"/></svg></button>
            <button type="button" class="tool play" data-toggle><svg class="icon fill"><use href="#i-pause"/></svg></button>
            <button type="button" class="tool" data-next><svg class="icon fill"><use href="#i-next"/></svg></button>
          </div>
          <div class="where" data-where hidden>
            <button type="button" class="device" data-device-row><svg class="icon"><use href="#i-laptop"/></svg><span data-device-name></span></button>
            <span class="repeat" data-repeat hidden><svg class="icon"><use href="#i-repeat-one"/></svg></span>
            <a class="external" data-external hidden target="_blank"><svg class="icon"><use href="#i-external"/></svg></a>
            <button type="button" class="external" data-stop-previews hidden><svg class="icon"><use href="#i-close"/></svg></button>
          </div>
          <button type="button" class="button primary connect" data-connect-player hidden></button>
        </section>
        <section class="next" data-next-panel hidden>
          <h3 data-next-label></h3>
          <ol data-queue></ol>
        </section>
      </div></div>
    </aside>

    <div class="grip" data-grip="sidebar"></div>
    <div class="grip" data-grip="inspector"></div>
    <div class="immersive" data-immersive hidden>
      <canvas class="record" aria-hidden="true" data-immersive-record></canvas>
      <button type="button" class="tool corner" data-pin aria-pressed="false" data-tip-at="left"><svg class="icon"><use href="#i-pin"/></svg></button>
      <button type="button" class="tool corner" data-restore data-tip-at="left"><svg class="icon"><use href="#i-restore"/></svg></button>
    </div>
    <div class="drop" data-drop hidden><svg class="icon"><use href="#i-record"/></svg><p data-drop-hint></p></div>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
