name = "moondog-model"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

# The address the app calls. The zone audiofool.ai is on the same Cloudflare account.
routes = [{ pattern = "moondog-api.audiofool.ai", custom_domain = true }]

[observability]
enabled = true

# Token counts per invite per day. Fill database_id from `wrangler d1 create moondog-model`.
[[d1_databases]]
binding = "DB"
database_name = "moondog-model"
database_id = "292845c7-378f-4cc4-b544-e88087d3052b"

# The upstream is the owner's choice and can change without an app release. It is not written
# here: this file is public, and the app never names the upstream. Set these with
# `wrangler secret put`:
#   UPSTREAM_BASE_URL  the upstream's OpenAI-compatible base address
#   UPSTREAM_MODEL     the upstream model ID
#   UPSTREAM_API_KEY   the upstream provider's key
#   ADMIN_TOKEN        the owner's key for /admin/invites
[vars]
DAILY_TOKEN_LIMIT = "3000000"
GLOBAL_DAILY_TOKEN_LIMIT = "40000000"
# Requests for one invite code in one clock minute, counted in D1.
PER_MINUTE_LIMIT = "20"
