name = "moondog-model"
main = "src/worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

# The address the app calls. The zone audiofool.ai is on the same Cloudflare account.
routes = [{ pattern = "moondog-api.audiofool.ai", custom_domain = true }]

[observability]
enabled = true

# Token counts per invite per day. Fill database_id from `wrangler d1 create moondog-model`.
[[d1_databases]]
binding = "DB"
database_name = "moondog-model"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 20 requests a minute for each invite code.
[[ratelimits]]
name = "PER_MINUTE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# The upstream is the owner's choice and can change without an app release.
# Set UPSTREAM_BASE_URL and UPSTREAM_MODEL here; set the secrets with `wrangler secret put`:
#   UPSTREAM_API_KEY  the upstream provider's key
#   ADMIN_TOKEN       the owner's key for /admin/invites
UPSTREAM_BASE_URL = "REPLACE_WITH_UPSTREAM_BASE_URL"
UPSTREAM_MODEL = "REPLACE_WITH_UPSTREAM_MODEL"
DAILY_TOKEN_LIMIT = "3000000"
GLOBAL_DAILY_TOKEN_LIMIT = "40000000"
